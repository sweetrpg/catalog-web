name: PR Validation

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Check formatting
        run: |
          swift format lint --recursive --strict Sources Tests

      - name: Build
        run: |
          swift build --build-tests

      - name: Test
        run: |
          swift test
