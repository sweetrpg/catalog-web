---
apiVersion: v1
kind: ConfigMap

metadata:
  name: web-env

data:
  ENV: dev
  PORT: "8080"
  REDIS_HOST: redis.sweetrpg-catalog.svc.cluster.local
  REDIS_PORT: "6379"
  # Separate logical DB from catalog-api on the same shared Redis instance - see the comment
  # next to RedisConfiguration in configure.swift.
  REDIS_DB: "1"
  # Server-to-server backend URLs, called directly Service-to-Service - no ingress in the path,
  # so no /0 or /1 API-version prefix (that's only stripped by catalog-api's Traefik middleware
  # in front of its public ingress; see strip-prefix-v1 in
  # services/catalog-api/kubernetes/overlays/dev/middlewares.yaml). Explicitly set here rather
  # than relying on BackendConfig.swift's default, which still has this wrong as of this
  # writing (bakes in a /0 that 404s on direct Service calls).
  CATALOG_API_URL: http://api-v1.sweetrpg-catalog.svc.cluster.local:8000
  # GAMESYSTEMS_API_URL: http://api-v1.sweetrpg-gamesystems.svc.cluster.local:8000
  # PROFILES_API_URL: http://api-v1.sweetrpg-profiles.svc.cluster.local:8000
  # SHELF_API_URL: http://api-v1.sweetrpg-shelf.svc.cluster.local:8000
  # Traefik strips /catalog before the request reaches this app (see middlewares.yaml), so the
  # app's own routes are unprefixed - but every link/form/redirect it generates needs to add
  # /catalog back so the *next* browser request round-trips through the ingress correctly. See
  # Request.basePath in AppPaths.swift.
  INGRESS_BASE_PATH: /catalog
  # Where the SweetRPG logo in the nav links out to - the platform's root site, not this app's
  # own home page. Differs per environment; see AppPaths.swift's rootURL.
  SWEETRPG_ROOT_URL: https://sweetrpg.local/
  # Base URL for shared frontend static assets (logo, favicon, stylesheet), served from
  # assets-web rather than this app's own Public/ - see docs/frontend-conventions.md in
  # sweetrpg/platform and AppPaths.swift's sharedAssetsURL.
  SHARED_ASSETS_URL: https://sweetrpg.local/assets
  # ALLOWED_ORIGINS: unset - this app is server-rendered, so same-origin page loads and form
  # posts never trigger a CORS preflight. Only set this if catalog-web starts exposing an API
  # of its own that another origin calls directly.
  BUILD_INFO_PATH: /app/config/build-info.json
  LOG_LEVEL: info
  # Tempo's distributor, same collector as the Go services (docs/service-conventions.md's
  # Telemetry section), but port 4317 (gRPC) rather than their 4318 (HTTP) - see the comment in
  # TracingSetup.swift for why (swift-otel only ships a gRPC exporter in the version pinned
  # here).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4317/
  # SENTRY_DSN: unset until this app has its own Sentry project/DSN provisioned - Sentry
  # reporting no-ops gracefully (see Application.sentryReporter) rather than failing if unset.
