---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-web-auth0

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth0
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless path as the dev overlay, i.e. the same Auth0 application/client id. That
        # application's Allowed Callback URLs must additionally include
        # https://sweetrpg-local.curlew-smoot.ts.net/catalog/auth/callback - Auth0 rejects the
        # redirect otherwise, TLS validity notwithstanding.
        - extract:
              key: /sweetrpg/dev/catalog/auth

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-web-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/cache/auth
