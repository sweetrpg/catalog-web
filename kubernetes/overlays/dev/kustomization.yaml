apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-catalog

resources:
  - ../../base
  - configmaps.yaml
  - ingress.yaml
  - middlewares/errors.yaml
  - middlewares/strip.yaml
  - pod-monitor.yaml
  - password.yaml
  - secrets/cache.yaml
  - secrets/misc.yaml
  - secrets/edit-session.yaml
  - secrets/shared-session.yaml

labels:
  - pairs:
      app.kubernetes.io/name: catalog-web
      app.kubernetes.io/version: v1
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: catalog
      com.sweetrpg/env: dev
    includeSelectors: false
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: catalog-web
    newName: ghcr.io/sweetrpg/catalog-web
    newTag: v0.0.1
