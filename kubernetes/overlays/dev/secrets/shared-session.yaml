---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-web-shared-session

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-shared-session
        creationPolicy: Owner
    dataFrom:
        # auth-web's own Redis instance requires auth - same Akeyless path its own redis-auth
        # ExternalSecret reads (sweetrpg-auth namespace). Renamed from REDIS_PASS to
        # SHARED_SESSION_REDIS_PASS on the way in so it doesn't collide with this app's own
        # cache Redis credentials above - configure.swift reads SHARED_SESSION_REDIS_PASS
        # for the shared session Redis specifically.
        - extract:
              key: /sweetrpg/auth/cache/auth
          rewrite:
              - regexp:
                    source: "REDIS_PASS"
                    target: "SHARED_SESSION_REDIS_PASS"
